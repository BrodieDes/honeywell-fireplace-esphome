# Fireplace RF firmware: Home Assistant control of a Vermont Castings gas fireplace
# (Honeywell RT8220A remote, RV8310 receiver/valve) by cloning the remote's RF frames.
# Board: Freenove ESP32-S3 WROOM (camera module unplugged)
# Radio: Ebyte E07-M1101D (CC1101, 433 MHz-matched), tuned to 303.825 MHz
#
# Frames are built and decoded by fireplace_codes.h (generated by tools/gen_codes.py
# from the captures; see protocol-notes.md).
#
# Safety (project brief section 11):
#   - Never transmits ON at boot. It sends OFF 10 s after boot, so a reboot or power
#     cut always leaves the fireplace off and HA's state matches it.
#   - Max runtime is enforced on the board, not only in HA: OFF is sent after the
#     "Max Runtime" hours even if Wi-Fi or HA is down. It also covers fires lit
#     with the original remote, which the board hears.
#   - The original remote keeps working. The board listens and updates HA when it
#     is used.
#
# Other fireplaces: "Learn Remote" copies any RT8220A-style remote. Press it, then any
# button on that remote within 60 s. "Remote ID" shows which remote the board copies.
#
# Recovery (see README.md):
#   - No Wi-Fi for 1 minute: the board starts the "Fireplace-RF Setup" hotspot with a
#     captive portal for entering new Wi-Fi details.
#   - Factory reset: power-cycle it 5 times, each within 10 s of the last.
#
# Wiring (CC1101 -> ESP32-S3):
#   VCC  -> 3V3 (never 5V)
#   GND  -> GND
#   SCK  -> GPIO12
#   MOSI -> GPIO11
#   MISO -> GPIO13
#   CSN  -> GPIO10
#   GDO0 -> GPIO14   (TX data in)
#   GDO2 -> GPIO21   (RX pin, raw demodulated output)

esphome:
  name: fireplace-rf
  friendly_name: Fireplace
  project:
    name: brodiedes.fireplace-remote
    version: "2.2.0"
  includes:
    - fireplace_codes.h
    - wifi_fallback.h
    - remote_rx.h
  on_boot:
    - priority: -100
      then:
        - cc1101.begin_rx: radio
        - delay: 10s
        - logger.log:
            level: INFO
            format: "Boot: sending OFF (fail-safe)"
        - lambda: "id(update_fire).execute(false, id(flame_lvl), id(fan_lvl), true, std::string(\"Boot\"));"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO
  # Logs on the CH343 USB port (the one used for flashing), for recovery.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key
  # The board is safe on its own (boot OFF, on-device max runtime), so don't
  # reboot it just because HA is not connected.
  reboot_timeout: 0s
  actions:
    # set_fire(is_off, flame 1-6, fan 0-6). Used by tools/send.py.
    - action: set_fire
      variables:
        is_off: bool
        flame: int
        fan: int
      then:
        - lambda: "id(update_fire).execute(!is_off, flame, fan, true, std::string(\"HA\"));"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Signal is weak (-80 dB) near the fireplace; keep the radio fully awake.
  power_save_mode: none
  output_power: 20dB
  # Setup mode: no Wi-Fi for 1 minute starts this hotspot. Credentials entered in
  # its captive portal are saved and override the ones above. Open on purpose: a
  # setup password gets lost, and the API key and OTA password still guard
  # control and firmware.
  ap:
    ssid: "Fireplace-RF Setup"

captive_portal:

# A typo in the setup portal can't strand the board: details that fail for 3 minutes
# are replaced by the last ones that connected (see wifi_fallback.h).
interval:
  - interval: 10s
    then:
      - lambda: "fireplace::wifi_fallback_check();"

# Power-cycle 5 times, each within 10 s of the last, to wipe saved settings
# (Wi-Fi, max runtime, levels) and fall back to the compiled defaults.
factory_reset:
  resets_required: 5
  max_delay: 10s
  on_increment:
    - logger.log:
        level: INFO
        format: "Factory reset: power cycle %u of %u"
        args: [x, target]

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

cc1101:
  id: radio
  cs_pin: GPIO10
  frequency: 303.825MHz
  modulation_type: ASK/OOK
  # 203 kHz covers the FCC band (303.725-303.925 MHz) plus resonator drift.
  filter_bandwidth: 203kHz
  # Measured idle noise: 0dB/16dB ~12/s, 12dB/16dB 0/s but too deaf to hear the
  # remote at 30 cm. 0dB/8dB ~0.5/s and receives the remote cleanly. The decoder
  # rejects noise, so a little is harmless.
  rx_attenuation: 0dB
  filter_length_ask_ook: 8dB    # OOK decision boundary
  hyst_level: High

globals:
  - id: fire_on
    type: bool
    initial_value: "false"
  - id: flame_lvl
    type: int
    restore_value: true
    initial_value: "3"
  - id: fan_lvl
    type: int
    restore_value: true
    initial_value: "0"
  # Which remote the board copies and listens to: its tail + ID (fireplace_codes.h).
  # Set by "Learn Remote"; a factory reset goes back to the remote in the captures.
  - id: remote_code
    type: uint64_t
    restore_value: true
    initial_value: "fireplace::DEFAULT_CODE"
  - id: learning
    type: bool
    initial_value: "false"
  - id: learn_unknown       # ID of a remote heard while learning with unknown codes
    type: uint32_t
    initial_value: "0"
  # Remote resends. The remote repeats its own state every ~10 min without a press. If
  # HA changed the fire since, that repeat undoes it: puts the fire out, or lights it.
  - id: remote_last         # state_key of the last state heard from the remote; unknown after boot
    type: int
    initial_value: "-100"
  - id: burst_start         # millis() of the first capture of the current transmission
    type: uint32_t
    initial_value: "0"
  - id: restore_pending     # a resend changed the fire; put it back unless the remote is used
    type: bool
    initial_value: "false"
  - id: relights            # relights in the current hour, and when that hour started
    type: int
    initial_value: "0"
  - id: relight_hour
    type: uint32_t
    initial_value: "0"

script:
  # The one place state changes. tx=false when the change came from the original
  # remote (the receiver already has it). source says why, for "Last Command".
  - id: update_fire
    mode: queued
    parameters:
      want_on: bool    # not "on": YAML reads that key as true
      flame: int
      fan: int
      tx: bool
      source: string
    then:
      - lambda: |-
          bool was_on = id(fire_on);
          id(fire_on) = want_on;
          if (flame > 0)
            id(flame_lvl) = flame > 6 ? 6 : flame;
          id(fan_lvl) = fan < 0 ? 0 : fan > 6 ? 6 : fan;
          if (tx)
            id(send_twice).execute(!want_on, id(flame_lvl), id(fan_lvl));
          if (want_on && !was_on)
            id(runtime_guard).execute();
          if (!want_on)
            id(runtime_guard).stop();
          char buf[64];
          if (want_on)
            snprintf(buf, sizeof(buf), "%s: flame %d, fan %d", source.c_str(), id(flame_lvl), id(fan_lvl));
          else
            snprintf(buf, sizeof(buf), "%s: off (next: flame %d, fan %d)", source.c_str(), id(flame_lvl), id(fan_lvl));
          id(last_command).publish_state(buf);

  # Every command goes out twice, 2 s apart, in case the first was missed. Each
  # frame carries the full state, so a repeat is harmless. A newer command
  # restarts this script, which drops the older command's pending repeat.
  - id: send_twice
    mode: restart
    parameters:
      is_off: bool
      flame: int
      fan: int
    then:
      - lambda: "id(send_state).execute(is_off, flame, fan);"
      - delay: 2s
      - lambda: "id(send_state).execute(is_off, flame, fan);"

  # Sends one state the way the remote does: ~1 s of back-to-back frames.
  - id: send_state
    mode: queued
    parameters:
      is_off: bool
      flame: int
      fan: int
    then:
      # Code 0 means no remote learned yet: there is nothing to copy, so stay silent.
      - if:
          condition:
            lambda: "return id(remote_code) == 0;"
          then:
            - logger.log:
                level: WARN
                format: "No remote learned yet: press Learn Remote. Nothing sent."
          else:
            - logger.log:
                level: INFO
                format: "TX state: off=%d flame=%d fan=%d"
                args: [is_off, flame, fan]
            - remote_transmitter.transmit_raw:
                transmitter_id: rf_tx
                code: !lambda "return fireplace::build_frames(id(remote_code), is_off, flame, fan);"

  # On-device max runtime. Started when the fire goes on, stopped when it goes off.
  - id: runtime_guard
    mode: restart
    then:
      - delay: !lambda "return (uint32_t) (id(max_runtime).state * 3600000.0f);"
      - logger.log:
          level: WARN
          format: "Max runtime reached: sending OFF"
      - lambda: "id(update_fire).execute(false, id(flame_lvl), id(fan_lvl), true, std::string(\"Max runtime\"));"

  # A remote resend changed the fire. If the remote stays quiet for 5 s, nobody is pressing
  # buttons, so send the board's state again. The board's state never changed, so the max
  # runtime keeps counting from the original turn-on. HA or max runtime turning the fire
  # off meanwhile changes that state, so this then sends OFF.
  - id: restore_state
    mode: restart
    then:
      - delay: 5s
      - lambda: |-
          if (!id(restore_pending))
            return;
          id(restore_pending) = false;
          if (id(fire_on))
            id(relights)++;
          ESP_LOGI("remote", "Remote resend not followed: sending the fire's state again");
          id(update_fire).execute(id(fire_on), id(flame_lvl), id(fan_lvl), true, std::string("Restored after remote resend"));

  # "Learn Remote": for 60 s, the next clean capture from any remote becomes the remote
  # the board copies. on_raw does the learning; this only opens and closes the window.
  - id: learn_remote
    mode: restart
    then:
      - lambda: |-
          id(learning) = true;
          id(learn_unknown) = 0;
          id(remote_id).update();
          ESP_LOGI("learn", "Learning: press any button on the remote within 60 s");
      - delay: 60s
      - lambda: |-
          if (!id(learning))
            return;
          id(learning) = false;
          id(remote_id).update();
          if (id(learn_unknown) != 0) {
            // Heard a remote, but only with flame/fan codes that aren't in our tables.
            char buf[64];
            snprintf(buf, sizeof(buf), "Learn: %07X not saved, its codes differ", (unsigned) id(learn_unknown));
            id(last_command).publish_state(buf);
            ESP_LOGW("learn", "%s", buf);
            return;
          }
          id(last_command).publish_state("Learn: timed out, remote unchanged");
          ESP_LOGW("learn", "Timed out: remote unchanged");

remote_transmitter:
  id: rf_tx
  pin: GPIO14          # GDO0
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.begin_rx: radio

# Hears the original remote and keeps HA in sync with it.
remote_receiver:
  id: rf_rx
  pin: GPIO21          # GDO2
  filter: 100us
  idle: 10ms
  tolerance: 25%
  use_dma: true
  rmt_symbols: 1024
  receive_symbols: 1024
  on_raw:
    then:
      - lambda: |-
          bool off;
          int flame, fan;
          if (id(learning)) {
            uint64_t code;
            bool known;
            std::string state;
            if (!fireplace::learn_code(x, code, known, off, flame, fan, &state))
              return;
            if (!known) {
              // Same frame layout, but a state field not in our tables. A press can arrive
              // in pieces with a known frame in the next one, so keep listening; the
              // timeout reports it if nothing better comes.
              id(learn_unknown) = fireplace::code_id(code);
              ESP_LOGW("learn", "Remote %07X sent unknown state %s", (unsigned) id(learn_unknown), state.c_str());
              return;
            }
            id(learning) = false;
            id(learn_remote).stop();
            char buf[64];
            id(remote_code) = code;
            snprintf(buf, sizeof(buf), "Learn: remote %07X saved", (unsigned) fireplace::code_id(code));
            ESP_LOGI("learn", "%s", buf);
            id(last_command).publish_state(buf);
            id(remote_id).update();
          }
          // Only the remote the board copies; neighbours' remotes are ignored.
          auto states = fireplace::capture_states(x, id(remote_code));
          if (states.empty())
            return;
          ESP_LOGI("rx", "Heard %u symbols: %s", (unsigned) x.size(), fireplace::frame_summary(states).c_str());
          if (!fireplace::decode_frames(x, id(remote_code), off, flame, fan))
            return;
          // Flame 0 is the burner off with the pilot lit (AUTO sends it when satisfied).
          bool on = !off && flame > 0;
          bool same_as_fire = on == id(fire_on) && (flame == 0 || flame == id(flame_lvl)) && fan == id(fan_lvl);

          // Resends. A press always changes what the remote shows (there is no OFF button:
          // OFF is reached through the mode cycle), so one burst of a single state equal to
          // the remote's last one is the remote repeating itself. If that undoes a change
          // made from HA, put it back after 5 s, unless the remote is used again first.
          int key = fireplace::state_key(off, flame, fan);
          bool repeat = key == id(remote_last);
          id(remote_last) = key;
          uint32_t now = millis();
          bool same_burst = now - id(burst_start) < 1500;  // one ~1 s transmission, several captures
          if (!same_burst)
            id(burst_start) = now;
          if (id(restore_pending)) {
            if (same_burst && repeat)
              return;  // the rest of the resend
            id(restore_pending) = false;
            id(restore_state).stop();
            ESP_LOGI("remote", "Remote used again: following it");
          } else if (repeat && !same_burst && states.size() == 1 && !same_as_fire) {
            if (now - id(relight_hour) > 3600000) {
              id(relight_hour) = now;
              id(relights) = 0;
            }
            if (!id(fire_on) || id(relights) < 8) {
              ESP_LOGI("remote", "Remote resent off=%d flame=%d fan=%d: restoring in 5 s unless it is used", off, flame, fan);
              id(restore_pending) = true;
              id(restore_state).execute();
              return;
            }
            ESP_LOGW("remote", "Already relit 8 times this hour: following the remote");
          }

          if (same_as_fire)
            return;  // a repeat of the same press
          ESP_LOGI("remote", "Remote: off=%d flame=%d fan=%d", off, flame, fan);
          id(update_fire).execute(on, flame, fan, false, std::string("Remote"));

switch:
  - platform: template
    name: None           # main entity: takes the device name, "Fireplace"
    icon: mdi:fireplace
    restore_mode: DISABLED
    lambda: "return id(fire_on);"
    turn_on_action:
      - lambda: "id(update_fire).execute(true, id(flame_lvl), id(fan_lvl), true, std::string(\"HA\"));"
    # Always transmits, even if the board already thinks it is off.
    turn_off_action:
      - lambda: "id(update_fire).execute(false, id(flame_lvl), id(fan_lvl), true, std::string(\"HA\"));"

# Levels apply immediately while the fire is on; while off they set the level
# used at the next turn-on.
select:
  - platform: template
    name: "Flame Level"
    icon: mdi:fire
    options: ["1", "2", "3", "4", "5", "6"]
    update_interval: 1s
    lambda: "return to_string(id(flame_lvl));"
    set_action:
      - lambda: "id(update_fire).execute(id(fire_on), atoi(x.c_str()), id(fan_lvl), id(fire_on), std::string(\"HA\"));"
  - platform: template
    name: "Fan Level"
    icon: mdi:fan
    options: ["Off", "1", "2", "3", "4", "5", "6"]
    update_interval: 1s
    lambda: "return id(fan_lvl) == 0 ? std::string(\"Off\") : to_string(id(fan_lvl));"
    set_action:
      - lambda: "id(update_fire).execute(id(fire_on), id(flame_lvl), x == \"Off\" ? 0 : atoi(x.c_str()), id(fire_on), std::string(\"HA\"));"

number:
  - platform: template
    id: max_runtime
    name: "Max Runtime"
    icon: mdi:timer-off-outline
    entity_category: config
    unit_of_measurement: h
    min_value: 1
    max_value: 8
    step: 0.5
    initial_value: 4
    optimistic: true
    restore_value: true

text_sensor:
  # What was last sent and why: HA, Remote, Max runtime, Boot or Resend.
  - platform: template
    id: last_command
    name: "Last Command"
    icon: mdi:remote
  # The ID of the remote the board copies, or the learning prompt.
  - platform: template
    id: remote_id
    name: "Remote ID"
    icon: mdi:remote-tv
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(learning))
        return {"Learning: press the remote"};
      if (id(remote_code) == 0)
        return {"Not learned: press Learn Remote"};
      char buf[12];
      snprintf(buf, sizeof(buf), "%07X", (unsigned) fireplace::code_id(id(remote_code)));
      return {buf};
  # This project's version (the esphome: project: block), not ESPHome's.
  - platform: template
    name: "Firmware Version"
    icon: mdi:new-box
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return {ESPHOME_PROJECT_VERSION};"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

button:
  # Sends the current state again, for when the fireplace and HA disagree.
  - platform: template
    name: "Resend State"
    icon: mdi:send
    on_press:
      - lambda: "id(update_fire).execute(id(fire_on), id(flame_lvl), id(fan_lvl), true, std::string(\"Resend\"));"
  # Copy a different remote: press this, then any button on that remote within 60 s.
  - platform: template
    name: "Learn Remote"
    icon: mdi:remote
    entity_category: config
    on_press:
      - script.execute: learn_remote
  - platform: restart
    name: "Restart"
